var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  //---------------------------------------------------------------------
  // QRUtil
  //---------------------------------------------------------------------

  var QRUtil = function() {

    var PATTERN_POSITION_TABLE = [
      [],
      [6, 18],
      [6, 22],
      [6, 26],
      [6, 30],

function carregarImg(src){
  if(!src) return Promise.resolve(null);
  if(imgs[src]) return Promise.resolve(imgs[src]);
  return new Promise(ok => { const i = new Image(); i.crossOrigin = "anonymous"; i.onload = () => { imgs[src] = i; ok(i); }; i.onerror = () => ok(null); i.src = src; });
}

// ---------- pastas ----------
async function carregarPastas(){
  $("lista").innerHTML = '<p class="aviso">Carregando nomes...</p>';
  try{
    const r = await fetch(ENDPOINT + "?acao=pastas");
    const j = await r.json();
    if(!j.ok) throw 0;
    pastas = j.pastas;
    localStorage.setItem("totem_pastas", JSON.stringify(pastas));
  }catch(_){
    try{ pastas = JSON.parse(localStorage.getItem("totem_pastas")) || []; }catch(e){ pastas = []; }
  }
  desenharLista();
}
function semAcento(s){ return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }
function desenharLista(){
  const q = semAcento($("busca").value.trim());
  const box = $("lista"); box.textContent = "";
  const vis = pastas.filter(p => !q || semAcento(p.nome).includes(q));
  if(!pastas.length){ box.innerHTML = '<p class="aviso">Nenhuma pasta encontrada. Verifique a conexão.</p>'; return; }
  if(!vis.length){ box.innerHTML = '<p class="aviso">Nenhum nome encontrado.</p>'; return; }
  vis.forEach(p => {
    const b = document.createElement("button");
    b.textContent = p.nome;
    b.onclick = () => escolher(p);
    box.appendChild(b);
  });
}
$("busca").addEventListener("input", desenharLista);

// ---------- câmera ----------
const W = 1080, H = 1920;          // formato stories (9:16)
const VW = 720, VH = 1280;         // vídeo em 9:16, mais leve para enviar
const MAX_VIDEO = 60;              // segundos máximos de gravação (a pessoa pode parar antes)
let lado = "user", modo = "foto", flashOn = false, audioTrack = null;
let contando = false, pausado = false, restante = 0, gravando = false, recorder = null, recT = null;

async function abrirCamera(){
  if(stream && stream.active) return;
  stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:lado, width:{ideal:1920}, height:{ideal:1920}}});
  $("video").srcObject = stream;
  $("video").classList.toggle("traseira", lado !== "user");
  await $("video").play();
}
function fecharCamera(){ if(stream){ stream.getTracks().forEach(t => t.stop()); stream = null; } }
function trilha(){ return stream && stream.getVideoTracks()[0]; }
function temTorch(){ const t = trilha(); try{ return !!(t && t.getCapabilities && t.getCapabilities().torch); }catch(_){ return false; } }
async function torch(on){ const t = trilha(); if(!temTorch()) return false; try{ await t.applyConstraints({advanced:[{torch:on}]}); return true; }catch(_){ return false; } }

async function irParaCamera(){
  try{ await abrirCamera(); }
  catch(e){ alert("Não foi possível abrir a câmera. Libere o acesso à câmera no Safari."); encerrar(); return; }
  tela("cam");
  $("topo").textContent = atual.nome;
  $("contador").textContent = salvas + " de " + LIMITE + " salvas";
  desenharMusicas();
  resetarDisparo();
}
$("iniciar").onclick = irParaCamera;

function resetarDisparo(){
  clearInterval(timer); contando = false; pausado = false;
  $("num").textContent = "";
  $("disparo").classList.remove("parar");
  $("disparo").textContent = "Iniciar contagem";
  travar(false);
}
function travar(on){ ["m-foto","m-video","m-bum","virar","t3","t5","t10"].forEach(id => $(id).disabled = on); }

[3,5,10].forEach(n => $("t" + n).onclick = () => {

});
function escolherModo(m){
  modo = m;
  ["foto","video","bum"].forEach(k => $("m-" + k).classList.toggle("on", (k === "bum" ? "bumerangue" : k) === m));
  desenharMusicas();
}
$("m-foto").onclick = () => escolherModo("foto");
$("m-video").onclick = () => escolherModo("video");
$("m-bum").onclick = () => { ctxAudio(); escolherModo("bumerangue"); };

$("virar").onclick = async () => {
  lado = lado === "user" ? "environment" : "user";
  fecharCamera();
  try{ await abrirCamera(); }catch(e){ lado = lado === "user" ? "environment" : "user"; await abrirCamera(); }
  if(flashOn && lado !== "user") torch(true);
};
$("flashbt").onclick = async () => {
  flashOn = !flashOn;
  $("flashbt").classList.toggle("on", flashOn);
  $("flashtx").textContent = flashOn ? "Flash on" : "Flash off";
  if(lado !== "user") await torch(flashOn);   // câmera traseira: lanterna do iPhone fica acesa
};

$("disparo").onclick = () => {
  if(modo !== "foto") ctxAudio();
  if(gravando){ pararVideo(); return; }
  if(!contando){ iniciarContagem(); return; }
  pausado = !pausado;
  $("disparo").textContent = pausado ? "Continuar contagem" : "Pausar contagem";
  if(pausado) $("num").textContent = restante + " ⏸";
  else $("num").textContent = restante;
};

function iniciarContagem(){
  pararPrevia(); desenharMusicas();
  contando = true; pausado = false; restante = SEGUNDOS;
  travar(true);
  $("num").textContent = restante;
  $("disparo").textContent = "Pausar contagem";
  clearInterval(timer);
  timer = setInterval(() => {
    if(pausado) return;
    restante--;
    if(restante > 0){ $("num").textContent = restante; return; }
    clearInterval(timer); contando = false;
    $("num").textContent = "";
    if(modo === "foto") fotografar(); else if(modo === "video") gravarVideo(); else gravarBumerangue();
  }, 1000);
}

// desenha o quadro da câmera recortado em 9:16 + rodapé com logos
function quadro(g, w, h){
  const v = $("video"), vw = v.videoWidth, vh = v.videoHeight;
  const faixa = Math.round(h * 0.075), ah = h - faixa;
  const k = Math.max(w / vw, ah / vh), dw = vw * k, dh = vh * k;
  g.save();
  if(lado === "user"){ g.translate(w, 0); g.scale(-1, 1); }   // frontal sai espelhada, como na tela
  g.drawImage(v, (w - dw) / 2, (ah - dh) / 2, dw, dh);
  g.restore();
  g.fillStyle = "#04163F"; g.fillRect(0, ah, w, faixa);
  const pad = Math.round(w * 0.06), alt = Math.round(faixa * 0.4);
  const lp = imgs[LOGO_PARCER];
  if(lp) g.drawImage(lp, pad, ah + (faixa - alt) / 2, alt * lp.naturalWidth / lp.naturalHeight, alt);
  const ls = LOGO_SAFRA && imgs[LOGO_SAFRA];
  if(ls){ const sa = Math.round(faixa * 0.55); g.drawImage(ls, w - pad - sa * ls.naturalWidth / ls.naturalHeight, ah + (faixa - sa) / 2, sa * ls.naturalWidth / ls.naturalHeight, sa); }
  else{
    g.textBaseline = "middle"; g.textAlign = "right";
    const y = ah + faixa / 2, fs = Math.round(faixa * 0.3);
    g.font = "700 " + fs + "px Inter, sans-serif"; g.fillStyle = "#7FB0FF"; g.fillText(" 2026", w - pad, y);
    const w2 = g.measureText(" 2026").width;
    g.font = "300 " + fs + "px Inter, sans-serif"; g.fillStyle = "#fff"; g.fillText("Nossa Safra", w - pad - w2, y);
  }
}

async function fotografar(){
  await carregarImg(LOGO_PARCER); await carregarImg(LOGO_SAFRA);
  const fl = $("flash");
  if(flashOn && lado === "user"){            // frontal: tela branca ilumina o rosto
    fl.style.transition = "none"; fl.style.opacity = 1;
    await new Promise(r => setTimeout(r, 350));
  }else if(flashOn){ await torch(true); await new Promise(r => setTimeout(r, 250)); }
  const c = document.createElement("canvas"); c.width = W; c.height = H;
  quadro(c.getContext("2d"), W, H);
  fl.style.transition = "none"; fl.style.opacity = 1;
  requestAnimationFrame(() => { fl.style.transition = "opacity .5s"; fl.style.opacity = 0; });
  const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.9));
  mostrarPrevia(blob, "foto");
}

// ---------- música ----------
// Coloque os 4 arquivos em totem/musicas/ com estes nomes (MP3 de ~30 s). Troque os títulos à vontade.
const MUSICAS = [
  {nome: "Treasure – Bruno Mars", arq: "musicas/treasure.mp3"},
  {nome: "Don't Start Now – Dua Lipa", arq: "musicas/dont-start-now.mp3"},
  {nome: "Feel It Still – Portugal. The Man", arq: "musicas/feel-it-still.mp3"},
];
// prévia: tocar a música antes de gravar
const ouvir = new Audio();
let tocando = -1;
function pararPrevia(){ ouvir.pause(); tocando = -1; }
ouvir.onended = () => { tocando = -1; desenharMusicas(); };
let musica = -1, actx = null;
const buffers = {};
function ctxAudio(){ if(!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if(actx.state === "suspended") actx.resume(); return actx; }
async function bufferMusica(i){
  if(i < 0) return null;
  if(buffers[i] !== undefined) return buffers[i];
  try{ const r = await fetch(MUSICAS[i].arq); if(!r.ok) throw 0; buffers[i] = await ctxAudio().decodeAudioData(await r.arrayBuffer()); }
  catch(_){ buffers[i] = null; }
  return buffers[i];
}
function desenharMusicas(){
  const box = $("musicas"); box.textContent = "";
  [{nome:"Sem música"}].concat(MUSICAS).forEach((m, k) => {
    const i = k - 1;
    const b = document.createElement("button");
    b.textContent = i < 0 ? m.nome : (tocando === i ? "■ " : "▶ ") + m.nome;
    b.className = i === musica ? "on" : "";
    b.onclick = () => {
      ctxAudio(); bufferMusica(i);
      if(i < 0){ musica = -1; pararPrevia(); }
      else if(tocando === i){ pararPrevia(); }
      else { musica = i; ouvir.src = MUSICAS[i].arq; ouvir.currentTime = 0; ouvir.play().catch(()=>{}); tocando = i; }
      desenharMusicas();
    };
    box.appendChild(b);
  });
  box.hidden = modo !== "bumerangue";
}
// monta o áudio da gravação: música (e voz, no vídeo comum)
async function audioGravacao(comVoz){
  const ac = ctxAudio();
  const dest = ac.createMediaStreamDestination();
  const parar = [];
  if(comVoz){
    if(!audioTrack){ try{ audioTrack = (await navigator.mediaDevices.getUserMedia({audio:true})).getAudioTracks()[0]; }catch(_){} }
    if(audioTrack){ const v = ac.createMediaStreamSource(new MediaStream([audioTrack])); v.connect(dest); }
  }
  const buf = comVoz ? null : await bufferMusica(musica);   // música só no bumerangue
  if(buf){
    const src = ac.createBufferSource(); src.buffer = buf; src.loop = true;
    const gn = ac.createGain(); gn.gain.value = comVoz ? 0.35 : 0.9;
    src.connect(gn); gn.connect(dest); src.start();
    parar.push(() => { try{ src.stop(); }catch(_){} });
  }
  const tem = comVoz ? !!audioTrack || !!buf : !!buf;
  return {track: tem ? dest.stream.getAudioTracks()[0] : null, parar: () => parar.forEach(f => f())};
}

// ---------- gravação ----------
function novoRecorder(canvas, audio){
  const st = canvas.captureStream(30);
  if(audio.track) st.addTrack(audio.track);
  const tipos = ["video/mp4;codecs=avc1,mp4a", "video/mp4", "video/webm"];
  const mime = tipos.find(t => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
  const rec = new MediaRecorder(st, mime ? {mimeType: mime, videoBitsPerSecond: 2000000} : {videoBitsPerSecond: 2000000});
  rec.partes = [];
  rec.ondataavailable = e => { if(e.data.size) rec.partes.push(e.data); };
  rec.blob = () => new Blob(rec.partes, {type: (rec.mimeType || mime || "video/mp4").split(";")[0]});
  return rec;
}

async function gravarVideo(){
  await carregarImg(LOGO_PARCER); await carregarImg(LOGO_SAFRA);
  if(flashOn){ if(lado === "user") $("ring").classList.add("on"); else await torch(true); }
  const c = document.createElement("canvas"); c.width = VW; c.height = VH;
  const g = c.getContext("2d");
  let vivo = true;
  (function loop(){ if(!vivo) return; quadro(g, VW, VH); requestAnimationFrame(loop); })();
  const audio = await audioGravacao(true);
  recorder = novoRecorder(c, audio);
  recorder.onstop = () => {
    vivo = false; gravando = false; clearInterval(recT); audio.parar();
    $("rec").hidden = true; $("ring").classList.remove("on");
    mostrarPrevia(recorder.blob(), "video");
  };
  recorder.start(1000);
  gravando = true;
  let t = 0; $("rect").textContent = 0; $("rec").hidden = false;
  $("disparo").classList.add("parar"); $("disparo").textContent = "Parar gravação";
  recT = setInterval(() => { t++; $("rect").textContent = t; if(t >= MAX_VIDEO) pararVideo(); }, 1000);
}
function pararVideo(){ if(recorder && recorder.state !== "inactive") recorder.stop(); }

// bumerangue: capta ~1,5 s e devolve ida e volta em loop
async function gravarBumerangue(){
  await carregarImg(LOGO_PARCER); await carregarImg(LOGO_SAFRA);
  if(flashOn){ if(lado === "user") $("ring").classList.add("on"); else await torch(true); }
  const BW = 540, BH = 960, FPS = 15, QUADROS = 36, VOLTAS = 2;   // ~2,4 s captados, ~9 s de loop
  $("disparo").disabled = true; $("disparo").textContent = "Gravando...";
  $("rec").hidden = false; $("rect").textContent = "↺";
  const frames = [];
  for(let i = 0; i < QUADROS; i++){
    const f = document.createElement("canvas"); f.width = BW; f.height = BH;
    quadro(f.getContext("2d"), BW, BH); frames.push(f);
    await new Promise(r => setTimeout(r, 1000 / FPS));
  }
  $("rec").hidden = true; $("ring").classList.remove("on");
  $("montando").hidden = false; $("mont-bar").style.width = "0%";
  const seq = frames.concat(frames.slice(1, -1).reverse());
  const c = document.createElement("canvas"); c.width = BW; c.height = BH;
  const g = c.getContext("2d");
  g.drawImage(seq[0], 0, 0);
  const audio = await audioGravacao(false);
  const rec = novoRecorder(c, audio);
  rec.start(500);
  const total = VOLTAS * seq.length; let feito = 0;
  for(let v = 0; v < VOLTAS; v++){
    for(const f of seq){ g.drawImage(f, 0, 0); feito++; $("mont-bar").style.width = Math.round(100 * feito / total) + "%"; await new Promise(r => setTimeout(r, 1000 / FPS)); }
  }
  await new Promise(r => { rec.onstop = r; rec.stop(); });
  audio.parar();
  $("disparo").disabled = false;
  $("montando").hidden = true;
  mostrarPrevia(rec.blob(), "bumerangue");
}

$("sair").onclick = () => {
  if($("disparo").disabled) return;            // durante a montagem do Boomerang, espera terminar
  if(gravando && recorder){ recorder.onstop = () => { gravando = false; clearInterval(recT); }; pararVideo(); }
  clearInterval(recT); $("rec").hidden = true; $("ring").classList.remove("on");
  pararPrevia(); resetarDisparo(); torch(false);
  tela("ola");
};

// ---------- prévia: refazer ou salvar ----------
const LIMITE = 10;
let salvas = 0, pendente = null;
function mostrarPrevia(blob, tipo){
  if(flashOn && lado !== "user") torch(false).then(() => { if(flashOn) torch(true); });
  const url = URL.createObjectURL(blob);
  [$("previmg"), $("prevvid")].forEach(el => { if(el.src && el.src.startsWith("blob:")) URL.revokeObjectURL(el.src); el.removeAttribute("src"); });
  const foto = tipo === "foto";
  $("previmg").hidden = !foto; $("prevvid").hidden = foto;
  if(foto) $("previmg").src = url; else { $("prevvid").src = url; $("prevvid").play().catch(()=>{}); }
  $("prevtx").textContent = ({foto:"Foto capturada", video:"Vídeo gravado", bumerangue:"Boomerang pronto"})[tipo] + " · gostou?";
  pendente = {blob, mime: blob.type || "image/jpeg"};
  const ultima = salvas + 1 >= LIMITE;
  $("salvar-outra").hidden = ultima;
  $("salvar-fim").textContent = ultima ? "Salvar e ver meu QR code" : "Salvar e encerrar";
  resetarDisparo();
  tela("prev");
}
function salvarPendente(){
  if(!pendente) return;
  fila.push({pasta: atual.id, blob: pendente.blob, mime: pendente.mime, tent: 0});
  pendente = null; salvas++;
  $("prevvid").pause();
  enviarFila();
}
$("refazer").onclick = () => { pendente = null; $("prevvid").pause(); irParaCamera(); };
$("salvar-outra").onclick = () => { salvarPendente(); if(salvas >= LIMITE) mostrarQR(); else irParaCamera(); };
$("salvar-fim").onclick = () => { salvarPendente(); mostrarQR(); };

// ---------- envio em segundo plano (nunca apaga nada) ----------
function base64(blob){ return new Promise((ok,no) => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1]); r.onerror = no; r.readAsDataURL(blob); }); }
function mostrarFila(){ $("fila").textContent = fila.length ? "Enviando " + fila.length + " arquivo(s)..." : ""; }
async function enviarFila(){
  mostrarFila();
  if(enviando) return;
  enviando = true;
  while(fila.length){
    const it = fila[0];
    let ok = false;
    try{
      const r = await fetch(ENDPOINT, {method:"POST", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify({tipo:"totem", pasta: it.pasta, mime: it.mime, dados: await base64(it.blob)})});
      ok = (await r.json()).ok;
    }catch(e){ console.warn(e); }
    if(ok){ fila.shift(); }
    else { it.tent++; await new Promise(r => setTimeout(r, Math.min(30000, 2000 * it.tent))); }
    mostrarFila();
  }
  enviando = false;
}
window.addEventListener("beforeunload", e => { if(fila.length){ e.preventDefault(); e.returnValue = ""; } });

// ---------- encerrar + QR ----------
$("verqr").onclick = mostrarQR;
function mostrarQR(){
  clearTimeout(inativo);
  $("fim-nome").textContent = atual.nome;
  const qr = qrcode(0, "M"); qr.addData(atual.link); qr.make();
  $("qrbox").innerHTML = qr.createImgTag(8, 0);
  tela("fim");
  let s = TEMPO_QR;
  $("fim-seg").textContent = "Voltando ao início em " + s + "s";
  clearInterval(timer);
  timer = setInterval(() => { s--; $("fim-seg").textContent = "Voltando ao início em " + s + "s"; if(s <= 0) encerrar(); }, 1000);
}
$("pronto-fim").onclick = encerrar;

function encerrar(){
  pararPrevia();
  pendente = null;
  clearInterval(timer); clearTimeout(inativo);
  if(gravando) pararVideo();
  torch(false);
  atual = null; $("busca").value = ""; desenharLista();
  tela("boas");
  $("lista").scrollTop = 0;
}

// ---------- tela sempre ligada ----------
async function manterLigada(){ try{ if("wakeLock" in navigator) await navigator.wakeLock.request("screen"); }catch(_){} }
document.addEventListener("visibilitychange", () => { if(!document.hidden) manterLigada(); });
document.addEventListener("touchend", manterLigada, {once:true});
document.addEventListener("gesturestart", e => e.preventDefault());

manterLigada();
carregarPastas();
setInterval(() => { if(!$("boas").hidden) carregarPastas(); }, 5 * 60 * 1000);
</script>
